services:
  db:
    image: postgres:16
    container_name: uk_agent_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: uk_agent_api
    restart: always
    env_file:
      - .env
    ports:
      - "${API_PORT}:8000"
    depends_on:
      - db

volumes:
  postgres_data:
